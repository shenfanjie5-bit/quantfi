name: 🐞 Bug Report
description: 报告一个可复现的问题（必须包含 run_id / trade_date / 版本信息）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量提供：trade_date、run_id、code_version、config_version、data_version。
        若是 CI 失败，请附上 Actions 链接与失败日志片段。

  - type: input
    id: trade_date
    attributes:
      label: trade_date (YYYYMMDD)
      placeholder: "20260206"
    validations:
      required: true

  - type: input
    id: run_id
    attributes:
      label: run_id (UUID)
      placeholder: "e.g. 7b8c0d6e-...."
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: versions (code/config/data/feature/model)
      placeholder: "code=..., config=..., data=..., feature=..., model=..."
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: 最小复现步骤（命令 + 参数 + 环境）
      value: |
        1) ...
        2) ...
        3) ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: 贴关键日志（包含 run_id / task / status / degrade_reasons）
      render: text
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks main (CI red / cannot run daily)
        - Degraded (fallback path / confidence penalty)
        - Minor (cosmetic / non-blocking)
    validations:
      required: true
